services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cipherscope}
      POSTGRES_USER: ${POSTGRES_USER:-cipherscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cipherscope-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cipherscope-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cipherscope-minio-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cipherscope-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cipherscope-minio-change-me}
      S3_BUCKET: ${S3_BUCKET:-cipherscope-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set cipherscope http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready cipherscope; do
        echo "Waiting for MinIO to become ready..."
        sleep 2
      done
      until mc mb --ignore-existing "cipherscope/$$S3_BUCKET" && mc stat "cipherscope/$$S3_BUCKET" >/dev/null; do
        echo "Waiting to create and verify bucket $$S3_BUCKET..."
        sleep 2
      done
      echo "MinIO bucket $$S3_BUCKET is ready."

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cipherscope:cipherscope-change-me@db:5432/cipherscope}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cipherscope-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cipherscope-minio-change-me}
      S3_BUCKET: ${S3_BUCKET:-cipherscope-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
      OBJECT_STORAGE_BACKEND: s3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
